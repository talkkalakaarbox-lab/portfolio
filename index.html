<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devansh Joshi — Developer</title>
<meta name="description" content="Devansh Joshi, IT student and full-stack developer. Delivery platforms, SaaS, workflow systems, automations and IoT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="content.js"></script>
<script src="resume.js"></script>
<style>
/* Colors and fonts: change these to restyle the whole site */
:root{--bg:#0d0d0e;--fg:#efeee9;--mute:#97978f;--dim:#5c5c56;--line:#242427;--sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Instrument Serif',Georgia,serif;--w:1120px;--ease:cubic-bezier(.2,.8,.1,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 28px}
.sm{font-size:13px;color:var(--mute)}

#bar{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%;z-index:30}

header.nav{position:sticky;top:0;z-index:20;background:rgba(13,13,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{font-weight:600;letter-spacing:-.01em}
.nav nav{display:flex;align-items:center;gap:30px;font-size:14px}
.nav nav a.l{color:var(--mute);position:relative;transition:color .2s}
.nav nav a.l:hover,.nav nav a.l.on{color:var(--fg)}
.nav nav a.l::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--fg);transform:scaleX(0);transform-origin:0 50%;transition:transform .3s var(--ease)}
.nav nav a.l.on::after{transform:scaleX(1)}
@media(max-width:700px){.nav nav a.l{display:none}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--fg);border-radius:999px;font-size:14px;font-weight:500;transition:background .25s,color .25s}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover{background:transparent;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateY(2px)}

.hero{padding:clamp(80px,14vw,170px) 0 clamp(64px,9vw,110px);position:relative;
  background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px);background-size:calc(100%/6) 100%}
.status{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-bottom:34px;border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:var(--bg)}
.dot{width:7px;height:7px;border-radius:50%;background:#6fcf97;box-shadow:0 0 0 0 rgba(111,207,151,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(111,207,151,0)}100%{box-shadow:0 0 0 0 rgba(111,207,151,0)}}
h1{font-weight:600;letter-spacing:-.05em;line-height:.92;font-size:clamp(3.6rem,13vw,10.5rem)}
h1 .m{display:block;overflow:hidden;padding-bottom:.08em}
h1 .m span{display:block;transform:translateY(105%);animation:rise 1.1s var(--ease) forwards}
h1 .m:nth-child(2) span{animation-delay:.12s}
h1 em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.03em}
@keyframes rise{to{transform:none}}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-top:clamp(36px,5vw,64px)}
.lead{max-width:34ch;font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.35;color:var(--mute);letter-spacing:-.01em}
.lead b{color:var(--fg);font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.fadein{opacity:0;transform:translateY(14px);animation:up .9s var(--ease) .5s forwards}
@keyframes up{to{opacity:1;transform:none}}

section{padding:clamp(72px,10vw,130px) 0;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:clamp(32px,5vw,60px)}
h2{font-weight:600;letter-spacing:-.04em;line-height:1;font-size:clamp(2.2rem,5.6vw,4.4rem)}

.proj{border-bottom:1px solid var(--line)}
.proj:first-child{border-top:1px solid var(--line)}
.ph{width:100%;display:grid;grid-template-columns:56px 1fr auto 28px;gap:8px 24px;align-items:center;padding:26px 0;transition:padding .35s var(--ease)}
.ph:hover{padding-left:12px}
.ph .n{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--dim)}
.ph h3{font-size:clamp(1.4rem,3vw,2.2rem);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.ph .tag{font-size:13px;color:var(--mute);text-align:right}
.ph .pl{width:28px;height:28px;position:relative}
.ph .pl::before,.ph .pl::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:var(--fg);transform:translate(-50%,-50%);transition:transform .35s var(--ease)}
.ph .pl::after{transform:translate(-50%,-50%) rotate(90deg)}
.proj.open .pl::after{transform:translate(-50%,-50%) rotate(0)}
.pb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.proj.open .pb{grid-template-rows:1fr}
.pb>div{overflow:hidden}
.pbi{padding:0 0 32px 80px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px 48px}
.pbi p{color:#cbcac3;max-width:46ch}
.pbi ul{list-style:none}
.pbi li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;color:#b7b6ae;display:flex;gap:12px}
.pbi li::before{content:"→";color:var(--dim)}
.pbi .stack{grid-column:1/-1;font-size:13px;color:var(--mute);margin-top:6px}
.plinks{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.plinks a{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--fg);transition:background .25s,color .25s,border-color .25s}
.plinks a:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.plinks a span{color:var(--mute);transition:color .25s}
.case-study{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
.case-study section{padding:0;border:0}
.case-study h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:5px}
.case-study p{font-size:14px;color:#b7b6ae;max-width:unset}
.case-study img{width:100%;max-height:320px;object-fit:cover;border:1px solid var(--line);border-radius:6px;grid-column:1/-1}
@media(max-width:760px){.case-study{grid-template-columns:1fr}}
.plinks a:hover span{color:var(--bg)}
@media(max-width:760px){.ph{grid-template-columns:36px 1fr 28px}.ph .tag{display:none}.pbi{padding-left:0;grid-template-columns:1fr}}

.about{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,5vw,80px)}
.about .big{font-size:clamp(1.6rem,3.4vw,2.8rem);line-height:1.15;letter-spacing:-.03em;font-weight:500}
.about .big em{font-family:var(--serif);font-weight:400;color:var(--mute)}
.about .side p{color:#c3c2bb}
.about .side p+p{margin-top:14px}
@media(max-width:800px){.about{grid-template-columns:1fr}}

.list .item{display:grid;grid-template-columns:200px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);transition:padding .35s var(--ease)}
.list .item:first-child{border-top:1px solid var(--line)}
.list .item:hover{padding-left:10px}
.list .k{color:var(--mute);font-size:14px}
.list .v{font-size:clamp(1.05rem,1.6vw,1.3rem);letter-spacing:-.01em}
.list .v .sub{display:block;color:var(--mute);font-size:14px;letter-spacing:0}
.list .r{color:var(--mute);font-size:13px}
.list .cert-item{grid-template-columns:200px minmax(0,1fr) auto 76px;align-items:center}
.cert-photo{width:64px;height:82px;object-fit:cover;border:1px solid var(--line);border-radius:5px;background:#171719;cursor:zoom-in;transition:transform .2s,border-color .2s}.cert-photo:hover{border-color:var(--mute)}
#cert-viewer{width:min(96vw,1200px);height:min(94vh,900px);max-width:none;max-height:none;margin:auto;padding:16px;background:#111113;color:var(--fg);border:1px solid #3a3a3e;border-radius:12px;overflow:hidden}#cert-viewer::backdrop{background:rgba(0,0,0,.88);backdrop-filter:blur(5px)}.cert-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.cert-viewer-title{font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cert-viewer-tools{display:flex;align-items:center;gap:8px;flex-shrink:0}.cert-viewer-tools button{border:1px solid #444;border-radius:7px;padding:6px 11px;font-size:14px;text-align:center}.cert-viewer-tools button:hover{background:#29292d}.cert-viewer-tools button:focus-visible{outline:2px solid white;outline-offset:2px}.cert-viewer-stage{height:calc(100% - 48px);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:18px 4px}.cert-viewer-stage img{display:block;width:min(88vw,1050px);max-width:none;height:auto;object-fit:contain;box-shadow:0 8px 40px #0008}.cert-zoom-level{font-size:12px;color:var(--mute);min-width:42px;text-align:center}@media(max-width:600px){#cert-viewer{width:100vw;height:100dvh;border-radius:0;padding:10px}.cert-viewer-tools{gap:5px}.cert-viewer-tools button{padding:7px 9px}.cert-viewer-stage{height:calc(100% - 54px)}}
@media(max-width:700px){.list .item{grid-template-columns:1fr;gap:2px}.list .cert-item{grid-template-columns:minmax(0,1fr) 64px;gap:4px 14px}.cert-item .k{grid-column:1}.cert-item .v{grid-column:1}.cert-item .r{grid-column:1}.cert-item .cert-photo{grid-column:2;grid-row:1 / span 3;align-self:center}}
h3.sub-h{font-size:14px;font-weight:500;color:var(--mute);margin:56px 0 18px}

.mail{display:inline-block;font-weight:600;letter-spacing:-.045em;line-height:1;font-size:clamp(1.8rem,6.4vw,5.2rem);word-break:break-all;background:linear-gradient(var(--fg),var(--fg)) 0 100%/0 2px no-repeat;padding-bottom:10px;transition:background-size .5s var(--ease)}
.mail:hover{background-size:100% 2px}
.cform{margin-top:56px;max-width:720px;display:grid;gap:22px}
.cform .row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cform label{display:grid;gap:8px;font-size:13px;color:var(--mute)}
.cform input,.cform textarea{font:inherit;font-size:17px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;border-radius:0;transition:border-color .25s;resize:vertical}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--fg)}
.cform .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cform .frow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cform button[disabled]{opacity:.5;cursor:default}
#fmsg.err{color:#e08a8a}#fmsg.ok{color:#6fcf97}
@media(max-width:600px){.cform .row2{grid-template-columns:1fr}}
.links{display:grid;grid-template-columns:repeat(4,1fr);margin-top:56px;border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);font-size:15px;transition:padding .3s var(--ease)}
.links a:hover{padding-left:10px}
.links a span:last-child{color:var(--mute)}
.links a.off{opacity:.4;pointer-events:none}
@media(max-width:800px){.links{grid-template-columns:1fr 1fr}.links a{padding-right:12px}}
footer{padding:28px 0 44px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.fade{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.fade.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  h1 .m span{transform:none;animation:none}
  .fadein{opacity:1;transform:none;animation:none}
  .fade{opacity:1;transform:none;transition:none}
  .dot{animation:none}.pb{transition:none}
}
</style>
</head>
<body>
<div id="bar"></div>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a class="l" href="#work">Work</a>
      <a class="l" href="#about">About</a>
      <a class="l" href="#skills">Skills</a>
      <a class="l" href="#contact">Contact</a>
      <a class="btn ghost" id="resume-nav" href="#" data-resume>Resume <span class="ar">↓</span></a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div class="status fadein"><span class="dot"></span><span><span id="status"></span> · <span id="city"></span> <span id="clock"></span></span></div>
      <h1 id="h1">
        <span class="m"><span id="first"></span></span>
        <span class="m"><span><em id="last"></em></span></span>
      </h1>
      <div class="hero-row fadein">
        <p class="lead" id="intro"></p>
        <div class="actions">
          <a class="btn solid" id="resume-hero" href="#" data-resume>Download resume <span class="ar">↓</span></a>
          <a class="btn ghost" href="#work">View work</a>
        </div>
      </div>
    </div>
  </div>

  <section id="work">
    <div class="wrap">
      <div class="head"><h2>Selected work</h2><span class="sm" id="proj-count"></span></div>
      <div id="projects"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="head"><h2>About</h2><span class="sm">Palanpur → Ahmedabad</span></div>
      <div class="about">
        <p class="big fade" id="about-big"></p>
        <div class="side fade" style="--d:.1s" id="about-side"></div>
      </div>
    </div>
  </section>

  <section id="skills">
    <div class="wrap">
      <div class="head"><h2>Skills</h2><span class="sm">What I use</span></div>
      <div class="list" id="skills-list"></div>
    </div>
  </section>

  <section id="education">
    <div class="wrap">
      <div class="head"><h2>Education</h2><span class="sm">Timeline</span></div>
      <div class="list" id="edu-list"></div>
      <h3 class="sub-h">Certifications</h3>
      <div class="list" id="cert-list"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="head"><h2>Let's talk</h2><span class="sm">Internships and project work</span></div>
      <a class="mail fade" id="mail" href="#"></a>
      <form id="cf" class="cform fade" novalidate>
        <div class="row2">
          <label>Name<input name="from_name" required maxlength="80" autocomplete="name"></label>
          <label>Email<input name="from_email" type="email" required maxlength="120" autocomplete="email"></label>
        </div>
        <label>Message<textarea name="message" rows="5" required maxlength="2000"></textarea></label>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="frow"><button class="btn solid" id="send" type="submit">Send message</button><span id="fmsg" class="sm" role="status" aria-live="polite"></span></div>
      </form>
      <div class="links fade">
        <a id="l-in" href="#" target="_blank" rel="noopener" aria-label="LinkedIn profile"><span>LinkedIn</span><span>↗</span></a>
        <a id="l-gh" href="#" target="_blank" rel="noopener" aria-label="GitHub profile"><span>GitHub</span><span>↗</span></a>
        <a id="l-ig" href="#" target="_blank" rel="noopener" aria-label="Instagram profile"><span>Instagram</span><span>↗</span></a>
        <a id="l-cv" href="#" data-resume><span>Resume</span><span>↓</span></a>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap sm"><span id="copy"></span><a href="#top">Back to top ↑</a></div></footer>

<dialog id="cert-viewer" aria-label="Certificate image viewer">
  <div class="cert-viewer-head">
    <div class="cert-viewer-title" id="cert-viewer-title">Certificate</div>
    <div class="cert-viewer-tools">
      <button type="button" id="cert-zoom-out" aria-label="Zoom out">−</button>
      <span class="cert-zoom-level" id="cert-zoom-level">100%</span>
      <button type="button" id="cert-zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="cert-zoom-reset">Reset</button>
      <button type="button" id="cert-viewer-close" aria-label="Close certificate viewer">✕</button>
    </div>
  </div>
  <div class="cert-viewer-stage" id="cert-viewer-stage"><img id="cert-viewer-image" alt="Full-size certificate"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<script type="module">
/* Nothing to edit here. Content comes from the admin panel (Firestore),
   with content.js as the fallback. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CACHE_KEY = 'site_cache_v1';

/* project links: optional source link + any number of preview links ("Label | URL" per line) */
const safeUrl = u => {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { const parsed = new URL(u); return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : ''; } catch (e) { return ''; }
};
// Keep only the tiny inline-markup subset supported by the content editor.
function safeImageData(value) {
  const v = String(value || '');
  return v.length <= 150000 && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : '';
}
function safeInline(value) {
  const doc = new DOMParser().parseFromString(String(value || ''), 'text/html');
  const allowed = new Set(['B','STRONG','EM','I','BR']);
  const walk = node => {
    if (node.nodeType === Node.TEXT_NODE) return esc(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return '';
    const children = [...node.childNodes].map(walk).join('');
    if (node.tagName === 'BR') return '<br>';
    return allowed.has(node.tagName) ? `<${node.tagName.toLowerCase()}>${children}</${node.tagName.toLowerCase()}>` : children;
  };
  return [...doc.body.childNodes].map(walk).join('');
}
function projLinks(p){
  const out = [];
  const a = (url, label) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} <span>↗</span></a>`;
  const src = safeUrl(p.source);
  if (src) out.push(a(src, 'Source code'));
  (p.previews || []).forEach(line => {
    line = String(line); const i = line.indexOf('|');
    const url = safeUrl(i > -1 ? line.slice(i + 1) : line);
    if (!url) return;
    const label = (i > -1 ? line.slice(0, i).trim() : '') || new URL(url).hostname.replace(/^www\./, '');
    out.push(a(url, label));
  });
  return out.length ? `<div class="plinks">${out.join('')}</div>` : '';
}
let CUR = SITE;

function merge(remote){
  const r = remote || {};
  const merged = { ...SITE, ...r, about: { ...SITE.about, ...(r.about || {}) }, cv: { ...SITE.cv, ...(r.cv || {}) }, emailjs: SITE.emailjs };
  // Avoid publishing academic SPI figures in visitor-generated resumes from older saved records.
  merged.education = (merged.education || []).map(item => ({ ...item, detail: String(item.detail || '').replace(/\s*\|\s*Semester\s+\d+\s+SPI:\s*[\d.]+/gi, '').replace(/^\s*\|\s*|\s*\|\s*$/g, '').trim() }));
  return merged;
}

/* ---------- render ---------- */
const fio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); fio.unobserve(e.target); } }), { threshold: .15 });
function observeFades(){
  document.querySelectorAll('.fade:not(.seen)').forEach((el, i) => {
    el.classList.add('seen');
    if (el.matches('.item')) el.style.setProperty('--d', (i % 6) * 0.06 + 's');
    fio.observe(el);
  });
}

function render(S){
  CUR = S;
  const full = `${S.firstName} ${S.lastName}`;
  document.title = `${full} — Developer`;
  $('brand').textContent = full;
  $('h1').setAttribute('aria-label', full);
  $('first').textContent = S.firstName;
  $('last').textContent = S.lastName;
  $('status').textContent = S.status;
  $('city').textContent = S.city;
  $('intro').innerHTML = safeInline(S.intro);
  $('copy').textContent = `© ${new Date().getFullYear()} ${full}`;

  $('mail').href = `mailto:${S.email}`; $('mail').textContent = S.email;
  [['l-in',S.linkedin],['l-gh',S.github],['l-ig',S.instagram]].forEach(([id,url]) => {
    const a = $(id), safe = safeUrl(url);
    if (safe) { a.href = safe; a.classList.remove('off'); } else { a.href = '#'; a.classList.add('off'); }
  });

  const P = S.projects || [];
  $('projects').innerHTML = P.map((p,i) => `
    <article class="proj${i===0?' open':''}">
      <button class="ph" type="button" aria-expanded="${i===0}" aria-controls="project-panel-${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${esc(p.title)}</h3><span class="tag">${esc(p.tag)}</span><span class="pl" aria-hidden="true"></span></button>
      <div class="pb" id="project-panel-${i}" aria-hidden="${i!==0}"><div><div class="pbi">
        <p>${esc(p.desc)}</p>
        <ul>${(p.points||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <span class="stack">${esc(p.stack)}</span>
        ${projLinks(p)}
        ${(() => {
          const fields = [['challenge','Challenge'],['contribution','My contribution'],['solution','Approach'],['outcome','Outcome']].filter(([key]) => String(p[key] || '').trim());
          const image = safeUrl(p.image);
          if (!fields.length && !image) return '';
          return `<div class="case-study">${image ? `<img src="${esc(image)}" alt="${esc(p.title)} project preview" loading="lazy" referrerpolicy="no-referrer">` : ''}${fields.map(([key,label]) => `<section><h4>${label}</h4><p>${esc(p[key])}</p></section>`).join('')}</div>`;
        })()}
      </div></div></div>
    </article>`).join('');
  $('proj-count').textContent = `${String(P.length).padStart(2,'0')} projects`;
  document.querySelectorAll('.proj .ph').forEach(btn => btn.addEventListener('click', () => {
    const p = btn.parentElement, open = !p.classList.contains('open');
    p.classList.toggle('open', open); btn.setAttribute('aria-expanded', open);
    const panel = btn.parentElement.querySelector('.pb'); if (panel) panel.setAttribute('aria-hidden', String(!open));
  }));

  $('about-big').innerHTML = safeInline(S.about.big);
  $('about-side').innerHTML = (S.about.paras || []).map(t => `<p>${esc(t)}</p>`).join('');
  $('skills-list').innerHTML = (S.skills || []).map(s => `<div class="item fade"><span class="k">${esc(s.name)}</span><span class="v">${esc(s.items)}</span><span class="r"></span></div>`).join('');
  const row = e => `<div class="item fade"><span class="k">${esc(e.when)}</span><span class="v">${esc(e.title)}<span class="sub">${esc(e.place)}</span></span><span class="r">${esc(e.note)}</span></div>`;
  $('edu-list').innerHTML = (S.education || []).map(row).join('');
  $('cert-list').innerHTML = (S.certs || []).map(e => {
    const image = safeImageData(e.image);
    return `<div class="item cert-item fade"><span class="k">${esc(e.when)}</span><span class="v">${esc(e.title)}<span class="sub">${esc(e.place)}</span></span><span class="r">${esc(e.note)}</span>${image ? `<img class="cert-photo" src="${image}" alt="${esc(e.title)} certificate photo — select to enlarge" title="Click to view certificate" role="button" tabindex="0" data-cert-title="${esc(e.title)}" loading="lazy">` : ''}</div>`;
  }).join('');
  observeFades();
}

/* first paint: last saved copy (instant), else the defaults */
let cached = null;
try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e) {}
render(merge(cached));

/* ---------- certificate image viewer with accessible zoom controls ---------- */
const certViewer = $('cert-viewer'), certViewerImage = $('cert-viewer-image');
let certZoom = 1, certLastTrigger = null;
function updateCertZoom(){
  certViewerImage.style.width = Math.round(Math.min(window.innerWidth * 0.88, 1050) * certZoom) + 'px';
  $('cert-zoom-level').textContent = Math.round(certZoom * 100) + '%';
  $('cert-zoom-out').disabled = certZoom <= 0.5;
  $('cert-zoom-in').disabled = certZoom >= 3;
}
function openCertificate(photo){
  certLastTrigger = photo;
  certZoom = 1;
  certViewerImage.src = photo.src;
  certViewerImage.alt = photo.alt || 'Full-size certificate';
  $('cert-viewer-title').textContent = photo.dataset.certTitle || 'Certificate';
  $('cert-viewer-stage').scrollTop = 0;
  updateCertZoom();
  if (!certViewer.open) certViewer.showModal();
  $('cert-viewer-close').focus();
}
$('cert-list').addEventListener('click', ev => {
  const photo = ev.target.closest('.cert-photo');
  if (photo) openCertificate(photo);
});
$('cert-list').addEventListener('keydown', ev => {
  const photo = ev.target.closest('.cert-photo');
  if (photo && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openCertificate(photo); }
});
$('cert-zoom-in').addEventListener('click', () => { certZoom = Math.min(3, +(certZoom + 0.25).toFixed(2)); updateCertZoom(); });
$('cert-zoom-out').addEventListener('click', () => { certZoom = Math.max(0.5, +(certZoom - 0.25).toFixed(2)); updateCertZoom(); });
$('cert-zoom-reset').addEventListener('click', () => { certZoom = 1; updateCertZoom(); $('cert-viewer-stage').scrollTo({top:0,left:0}); });
$('cert-viewer-close').addEventListener('click', () => certViewer.close());
certViewer.addEventListener('click', ev => { if (ev.target === certViewer) certViewer.close(); });
certViewer.addEventListener('close', () => { certViewerImage.removeAttribute('src'); if (certLastTrigger) certLastTrigger.focus(); });
document.addEventListener('keydown', ev => {
  if (!certViewer.open) return;
  if (ev.key === '+' || ev.key === '=') { certZoom = Math.min(3, +(certZoom + 0.25).toFixed(2)); updateCertZoom(); }
  if (ev.key === '-') { certZoom = Math.max(0.5, +(certZoom - 0.25).toFixed(2)); updateCertZoom(); }
  if (ev.key === '0') { certZoom = 1; updateCertZoom(); }
});

/* then fetch the latest from Firestore */
(async () => {
  try {
    const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
    ]);
    const db = getFirestore(initializeApp(FIREBASE_CONFIG));
    const snap = await Promise.race([getDoc(doc(db, 'site', 'content')), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
    if (!snap.exists()) return;
    const remote = snap.data(); delete remote.updatedAt;
    if (JSON.stringify(remote) === JSON.stringify(cached)) return;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(remote)); } catch(e) {}
    render(merge(remote));
  } catch (e) { /* offline or not set up yet: keep what is on screen */ }
})();

/* ---------- resume: build the PDF on click and save it to the visitor's device ---------- */
document.querySelectorAll('[data-resume]').forEach(a => {
  ['pointerenter', 'touchstart', 'focus'].forEach(ev => a.addEventListener(ev, () => window.Resume && Resume.prefetch(), { once: true, passive: true }));
  a.addEventListener('click', async ev => {
    ev.preventDefault();
    if (a.dataset.busy || !window.Resume) return;
    a.dataset.busy = '1';
    const label = a.firstChild, orig = label.textContent;
    label.textContent = 'Preparing… ';
    try { await Resume.download(CUR); }
    catch (e) { alert('Could not create the PDF right now. Please check your connection and try again, or email ' + CUR.email + '.'); }
    label.textContent = orig; delete a.dataset.busy;
  });
});

/* ---------- contact form ---------- */
(function(){
  const form = $('cf'), msg = $('fmsg'), btn = $('send');
  const set = (t, c) => { msg.textContent = t; msg.className = 'sm' + (c ? ' ' + c : ''); };
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const S = CUR, E = S.emailjs || {};
    const ready = E.publicKey && E.serviceId && E.notifyTemplate;
    const f = new FormData(form);
    if (f.get('company')) { set('Thanks!', 'ok'); form.reset(); return; }   // honeypot: bots fill this
    const name = (f.get('from_name') || '').trim(), email = (f.get('from_email') || '').trim(), message = (f.get('message') || '').trim();
    if (!name || !message || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { set('Please fill in your name, a valid email and a message.', 'err'); return; }
    let last = 0; try { last = +localStorage.getItem('cf_last') || 0; } catch(e) {}
    if (Date.now() - last < 60000) { set('Please wait a minute before sending another message.', 'err'); return; }
    btn.disabled = true; set('Sending…');
    try {
      if (ready && typeof emailjs !== 'undefined') {
        emailjs.init({ publicKey: E.publicKey });
        await emailjs.send(E.serviceId, E.notifyTemplate, { from_name: name, from_email: email, message, reply_to: email, to_email: S.email });
        if (E.replyTemplate) { try { await emailjs.send(E.serviceId, E.replyTemplate, { to_name: name, to_email: email, owner_name: S.firstName }); } catch(e) {} }
      } else {
        // Default: FormSubmit.co, no account needed. Emails you, and auto-replies to the visitor.
        const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(S.email), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ name, email, message, _subject: 'Portfolio message from ' + name, _replyto: email, _template: 'table',
            _autoresponse: `Hi ${name}, thanks for reaching out. I received your message and will reply soon. — ${S.firstName} ${S.lastName}` })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.success === false || j.success === 'false') throw new Error('send failed');
      }
      try { localStorage.setItem('cf_last', Date.now()); } catch(e) {}
      set('Sent. Check your inbox for a confirmation.', 'ok'); form.reset();
    } catch (e) {
      set(`Could not send. Please email ${S.email} directly.`, 'err');
    }
    btn.disabled = false;
  });
})();

/* ---------- clock, progress, active nav ---------- */
function tick(){ $('clock').textContent = '· ' + new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true }); }
tick(); setInterval(tick, 30000);

const bar = $('bar');
function prog(){ const m = document.documentElement.scrollHeight - innerHeight; bar.style.transform = `scaleX(${m > 0 ? scrollY / m : 0})`; }
addEventListener('scroll', () => requestAnimationFrame(prog), { passive: true }); prog();
const links = [...document.querySelectorAll('nav a.l')];
const sio = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
}), { rootMargin: '-45% 0px -50% 0px' });
['work','about','skills','contact'].forEach(id => sio.observe($(id)));
</script>
</body>
